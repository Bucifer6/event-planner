# Local evaluation copy of EventDesk.ro — loopback only.
#   docker compose up --build
# App: http://localhost:3000  ·  Public site: http://localhost:3001  ·  DB: localhost:5432
# Every published port is bound to 127.0.0.1; nothing is exposed beyond the host.
# Dev email provider: sign-in codes land in the EmailOutbox table, never sent (INF2).
name: eventdesk-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventdesk
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventdesk']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventdesk
      APP_URL: http://localhost:3000
      PUBLIC_URL: http://localhost:3001
      PUBLIC_SITE_URL: http://localhost:3001
      EMAIL_PROVIDER: dev
      EMAIL_FROM: EventDesk <noreply@localhost>
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    command: ['worker']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventdesk
      EMAIL_PROVIDER: dev
      EMAIL_FROM: EventDesk <noreply@localhost>
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:80'

volumes:
  pgdata:
