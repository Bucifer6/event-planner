# R0-14 / DEP1–DEP7: production deploy pipeline. Artifact of the repo; runs only on
# tagged releases (v*.*.*) with the `production` GitHub environment (DEP3: second-person
# approval is enforced by environment protection rules, not by this file).
# Order per DEP4: backup -> migrate -> release -> health checks -> auto-rollback.
name: deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (v*.*.*)'
        required: true
      emergency:
        description: 'Emergency deploy despite failing CI (DEP3/DEP7 — audit-marked)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # for the cloud provider OIDC role (DEP1: scoped to this repo)

concurrency:
  group: deploy-production
  cancel-in-progress: false # deploys disabled while one is running (R0-14)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.eventdesk.ro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DEP7: refuse to deploy a tag whose CI is not green, unless the audited
      # emergency path was explicitly chosen (recorded as emergency=true).
      - name: Check CI status of the tag (DEP7)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG/status" --jq '.state')
          echo "ci_status=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "success" ] && [ "${{ github.event.inputs.emergency }}" != "true" ]; then
            echo "CI for $TAG is '$STATUS' — deploy refused (DEP7). Use the emergency input only with a recorded reason." >&2
            exit 1
          fi

      - run: pnpm --filter @eventdesk/db exec prisma generate

      - name: Record deploy start (DEP6)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CI_STATUS: ${{ env.ci_status }}
          EMERGENCY: ${{ github.event.inputs.emergency }}
        run: node scripts/record-deploy.mjs start

      # DEP4 step 1: backup BEFORE any migration (INF10/SEC9).
      - name: Backup database (DEP4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump "$DATABASE_URL" | gzip > "/tmp/eventdesk-$ts.sql.gz"
          aws s3 cp "/tmp/eventdesk-$ts.sql.gz" "s3://$BACKUP_BUCKET/pre-migrate/$ts.sql.gz" --sse aws:kms

      # DEP4 step 2: migrations (prisma migrate deploy).
      - name: Migrate database (DEP4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @eventdesk/db exec prisma migrate deploy

      # DEP4 step 3: build + push the release image.
      - name: Build and push release image (DEP4)
        env:
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository }}/web
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -f apps/web/Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      # DEP4 step 4: roll the app to the new image (infra/terraform, operator-applied).
      - name: Deploy release (DEP4)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          aws ecs update-service --cluster "eventdesk-prod" --service "eventdesk-prod" \
            --force-new-deployment --region "${{ vars.AWS_REGION }}"

      # DEP4 step 5: health checks; failure triggers automatic rollback.
      - name: Health checks (DEP4) — auto-rollback on failure
        id: health
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://app.eventdesk.ro/api/health > /dev/null; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Record deploy done (DEP6)
        if: steps.health.outputs.healthy == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/record-deploy.mjs done

      # DEP4/DEP5: automatic rollback to the previous release; never deletes data; a
      # non-reversible migration stops the rollback with a message instead.
      - name: Auto-rollback to previous release (DEP4/DEP5)
        if: failure() && steps.health.outputs.healthy == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PREV=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^$TAG$" | head -1)
          echo "rolling back to $PREV (no data is deleted; DEP5)"
          aws ecs update-service --cluster "eventdesk-prod" --service "eventdesk-prod" \
            --task-definition "eventdesk-prod:$PREV" --force-new-deployment --region "${{ vars.AWS_REGION }}"
          DATABASE_URL="$DATABASE_URL" TAG="$TAG" node scripts/record-deploy.mjs rolled_back
          echo "Automatic rollback to $PREV complete. If a migration was non-reversible, stop and follow docs/build/14-deploy-runbook.md (DEP5)."
